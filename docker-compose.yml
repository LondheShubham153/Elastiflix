# ===========================================================================
#  Elastic Stack in One Shot — the entire architecture, in one file.
#
#  SEARCH ENGINE          INGEST                      THE APP
#  ─────────────          ──────                      ───────
#  elasticsearch  :9200   logstash    :5044           backend   :17700
#  kibana         :5601   filebeat                    frontend  :3000
#                         metricbeat
#
#  How the data flows:
#
#    movies.ndjson ──► LOGSTASH ──────────────────► ELASTICSEARCH ──► KIBANA
#                      (parse, enrich)                    ▲              ▲
#    app logs ──► FILEBEAT ──► LOGSTASH ─────────────────►│              │
#    container metrics ──► METRICBEAT ───────────────────►┘              │
#                          (no transform needed, so it skips Logstash)   │
#    you ──► FRONTEND ──► BACKEND ──────────────────────────────────────►┘
#
#  Start it with ./start.sh — not `docker compose up -d`. The catalogue at
#  elk/data/movies.ndjson is generated, not committed; compose alone would
#  bind-mount an empty directory and Logstash would index nothing.
#
#  SECURITY: xpack.security is disabled on purpose. This is a local teaching
#  demo — it removes passwords, TLS certs and API keys as moving parts.
#  NEVER run a real cluster this way.
# ===========================================================================

name: elastiflix

services:

  # ── SEARCH ENGINE ────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.1.0}
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node          # don't go looking for peers
      - xpack.security.enabled=false        # demo only — see note above
      - xpack.license.self_generated.type=basic
      - bootstrap.memory_lock=true          # never swap the heap to disk
      - ES_JAVA_OPTS=-Xms1g -Xmx1g          # pin the heap so the stack fits a laptop
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      # Yellow is CORRECT on one node — a replica can't sit on the same node as
      # its primary, so it stays unassigned forever. Waiting for green hangs.
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.1.0}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Two banners Kibana shows by default that you do not want on camera:
      # the telemetry opt-in bar across the top, and a persistent "Your data
      # is not secure" toast in the bottom-right (expected -- security is off
      # on purpose here, and the toast covers dashboard panels).
      - TELEMETRY_OPTIN=false
      - TELEMETRY_ENABLED=false
      - XPACK_SECURITY_SHOWINSECURECLUSTERWARNING=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  # ── INGEST ───────────────────────────────────────────────────────────────

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-9.1.0}
    container_name: logstash
    environment:
      - ES_HOST=http://elasticsearch:9200
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "5044:5044"   # beats input — Filebeat ships here
      - "9600:9600"   # monitoring API — also what the healthcheck hits
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      # Index templates — Logstash installs these itself before ingesting
      # anything, so mappings are never left to dynamic guessing.
      - ./elk/logstash/templates:/usr/share/logstash/templates:ro
      # The movie catalogue, as NDJSON. Generated by ./start.sh
      - ./elk/data:/data:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/pipelines | grep -q applogs"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-9.1.0}
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/beats/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Filebeat reads container logs straight off the Docker host.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeatdata:/usr/share/filebeat/data
    depends_on:
      # Wait until Logstash is actually listening on 5044, or the first
      # batches die with "connection reset by peer".
      logstash: { condition: service_healthy }

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${STACK_VERSION:-9.1.0}
    container_name: metricbeat
    user: root
    command: ["metricbeat", "-e", "--strict.perms=false"]
    environment:
      - ES_HOST=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
      # Set to false to skip the 3-5 minute dashboard reload between takes.
      - METRICBEAT_SETUP_DASHBOARDS=${METRICBEAT_SETUP_DASHBOARDS:-true}
    volumes:
      - ./elk/beats/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - metricbeatdata:/usr/share/metricbeat/data
    depends_on:
      # Needs Kibana up because it loads ~112 prebuilt dashboards on first run.
      kibana: { condition: service_healthy }

  # ── THE APP ──────────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: elastiflix-backend
    environment:
      - LOCAL=true
      - NODE_ENV=development
      # Must match the frontend's PUBLIC_HOST so CORS allows the browser's
      # origin — localhost by default, or the EC2 public IP/DNS via
      # PUBLIC_HOST (see aws/ec2-setup.sh).
      - PUBLIC_HOST=${PUBLIC_HOST:-localhost}
      # `elasticsearch` is the service name above — Docker resolves it for us.
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=elastiflix-movies
      - ES_API_KEY=
    ports:
      - "17700:17700"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      elasticsearch: { condition: service_healthy }

  frontend:
    build: ./frontend
    container_name: elastiflix-frontend
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # The browser talks to the backend directly, so this must be a host it
      # can reach — localhost by default, or the EC2 public IP/DNS via
      # PUBLIC_HOST (see aws/ec2-setup.sh).
      - REACT_APP_ES_API=http://${PUBLIC_HOST:-localhost}:17700/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  esdata:
  filebeatdata:
  metricbeatdata:
