# ---------------------------------------------------------------------------
# Elastiflix movie catalog loader
#
# This replaces data-loader/index-data.py with a declarative Logstash pipeline.
# Same source file, same target index, same result -- but every stage of the
# ETL is visible instead of buried in Python.
#
#   input  -> where the data comes from
#   filter -> how we clean, convert and ENRICH it
#   output -> where it lands
# ---------------------------------------------------------------------------

input {
  file {
    path            => "/data/movies.ndjson"
    start_position  => "beginning"
    sincedb_path    => "/dev/null"   # always re-read: we want a repeatable demo
    codec           => json          # one JSON movie per line
    mode            => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/movies-done.log"
  }
}

filter {

  # --- 1. Drop the plumbing Logstash adds but Elasticsearch doesn't need -----
  mutate {
    remove_field => [ "@version", "event", "log", "host", "path" ]
  }

  # --- 2. Type coercion -----------------------------------------------------
  # The source data has `id` as an integer, but the mapping wants a keyword.
  mutate {
    convert => { "id" => "string" }
  }

  # --- 3. ENRICHMENT: derive the field the app needs but the data lacks ------
  # The Elastiflix UI renders a "user_score" range facet, but not one of the
  # 6,959 source documents actually contains that field -- so the facet is
  # always empty. TMDB's vote_average is the same 0-10 scale, so we derive it
  # here. This is the thing Logstash gives you that a dumb bulk load does not.
  if [vote_average] {
    ruby {
      code => "event.set('user_score', event.get('vote_average').to_f)"
    }
  }

  # --- 4. Dates -------------------------------------------------------------
  # Some records have an empty release_date. Remove it rather than let it fail
  # the mapping, then use the real ones to drive @timestamp so Kibana can plot
  # the catalog over time.
  if [release_date] == "" {
    mutate { remove_field => [ "release_date" ] }
  } else {
    date {
      match  => [ "release_date", "yyyy-MM-dd" ]
      target => "@timestamp"
      tag_on_failure => [ "_dateparsefailure" ]
    }
  }

  # --- 5. Quality gate ------------------------------------------------------
  # A movie with no title is useless to a search app.
  if ![title] or [title] == "" {
    drop { }
  }
}

output {
  elasticsearch {
    hosts       => [ "${ES_HOST}" ]
    ssl_enabled => false
    index       => "elastiflix-movies"
    document_id => "%{id}"          # re-running updates instead of duplicating
    action      => "index"
  }

  # Uncomment on camera to watch documents flow through the pipeline live.
  # stdout { codec => rubydebug }
}
