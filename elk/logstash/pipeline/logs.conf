# ---------------------------------------------------------------------------
# Elastiflix application logs:  Filebeat -> Logstash -> Elasticsearch
#
# Filebeat tails the container stdout and ships raw lines here. Logstash is
# what turns "a line of text" into "a document you can aggregate on".
# ---------------------------------------------------------------------------

input {
  beats {
    port => 5044
  }
}

filter {

  # Our backend emits one JSON object per line. Parse it into real fields.
  # Anything that isn't JSON (npm noise, nodemon banners) just stays as
  # `message` and gets tagged, rather than blowing up the pipeline.
  if [message] =~ /^\s*\{/ {
    json {
      source        => "message"
      target        => "app"
      skip_on_invalid_json => true
      add_tag       => [ "json_parsed" ]
    }
  }

  # Promote the fields we want to chart to the top level.
  if [app] {
    mutate {
      rename => {
        "[app][method]"      => "http_method"
        "[app][path]"        => "http_path"
        "[app][status]"      => "http_status"
        "[app][duration_ms]" => "duration_ms"
        "[app][query]"       => "search_query"
        "[app][results]"     => "result_count"
        "[app][level]"       => "log_level"
        "[app][search_type]" => "search_type"
        "[app][service]"     => "service"
      }
    }

    # Use the time the backend wrote the line, not the time Filebeat happened
    # to read it. Without this every document is stamped seconds late and the
    # latency panels lie.
    date {
      match  => [ "[app][@timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
    mutate {
      convert => {
        "http_status"  => "integer"
        "duration_ms"  => "float"
        "result_count" => "integer"
      }
    }
  }

  # A search that returned nothing is a product signal worth being able to find.
  if [result_count] == 0 and [search_query] {
    mutate { add_tag => [ "zero_results" ] }
  }

  # Slow requests, flagged at ingest so the dashboard doesn't have to compute it.
  if [duration_ms] and [duration_ms] > 500 {
    mutate { add_tag => [ "slow_request" ] }
  }

  # Drop everything that isn't worth a mapped field. Filebeat is generous:
  # a single log line arrives carrying the container's full Docker label set
  # (including absolute host paths), the raw line twice over, and inode-level
  # file bookkeeping. Left alone that is 97 mapped fields for ~20 useful ones,
  # and Discover becomes unreadable on camera.
  #
  # `app` goes last -- by now every field worth charting has been promoted
  # out of it by the rename above.
  mutate {
    remove_field => [
      "@version", "agent", "ecs", "input", "app",
      "docker",             # duplicate of [container], plus every compose label
      "event",              # event.original is byte-for-byte [message]
      "[container][labels]",
      "[container][image]",
      "[log][file][device_id]", "[log][file][inode]", "[log][file][fingerprint]",
      "[log][offset]",
      "[host][name]"        # the container ID, already in [container][name]
    ]
  }
}

output {
  elasticsearch {
    hosts       => [ "${ES_HOST}" ]
    ssl_enabled => false
    index       => "elastiflix-logs-%{+YYYY.MM.dd}"

    # Same trick as movies.conf, and here it matters even more: search_query
    # MUST be a keyword. Let dynamic mapping make it `text` and the "top search
    # terms" panel becomes impossible -- you get "Fielddata is disabled".
    manage_template    => true
    template           => "/usr/share/logstash/templates/logs-template.json"
    template_name      => "elastiflix-logs"
    template_overwrite => true
  }
}
