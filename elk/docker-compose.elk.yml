# ---------------------------------------------------------------------------
# Elastic Stack in One Shot -- the whole stack in one file.
#
#   Elasticsearch  :9200   the search + storage engine
#   Kibana         :5601   the UI
#   Logstash       :5044   ingest: loads the movie catalog AND receives logs
#   Filebeat               ships Elastiflix container logs -> Logstash
#   Metricbeat             ships container metrics -> Elasticsearch
#
# SECURITY NOTE: xpack.security is disabled here on purpose. This is a local
# teaching demo -- it removes passwords, TLS certs and API keys as moving
# parts. NEVER run a real cluster this way.
# ---------------------------------------------------------------------------

name: elastiflix-elk

x-stack-version: &stack_version ${STACK_VERSION:-9.1.0}

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.1.0}
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - bootstrap.memory_lock=true
      # Keep the heap small so the whole stack fits in a laptop-sized Docker VM.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      # Yellow is correct for a single node: replicas can never be allocated.
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.1.0}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-9.1.0}
    container_name: logstash
    environment:
      - ES_HOST=http://elasticsearch:9200
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "5044:5044"   # beats input
      - "9600:9600"   # logstash monitoring API
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      # The NDJSON the movies pipeline reads (generated by setup/02-prepare-data.sh)
      - ./data:/data:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-9.1.0}
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./beats/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Filebeat reads container logs straight off the Docker host.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeatdata:/usr/share/filebeat/data
    depends_on:
      - logstash

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${STACK_VERSION:-9.1.0}
    container_name: metricbeat
    user: root
    command: ["metricbeat", "-e", "--strict.perms=false"]
    environment:
      - ES_HOST=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
    volumes:
      - ./beats/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - metricbeatdata:/usr/share/metricbeat/data
    depends_on:
      kibana: { condition: service_healthy }

volumes:
  esdata:
  filebeatdata:
  metricbeatdata:

networks:
  default:
    name: elastiflix-net
